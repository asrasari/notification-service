name: notification-service

# Shared settings for the three services that run the one image (D-004).
# Only migrate builds it; api and worker reuse the same tag (D-020).
# Values in .env (optional) are loaded first; `environment` below overrides
# them, so DATABASE_URL always points at the compose Postgres.
x-app: &app
  image: notification-service:local
  pull_policy: never
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://notifications:notifications@postgres:5432/notifications?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: notifications
    # Not published to the host: use `docker compose exec postgres psql -U
    # notifications`. Tests start their own Postgres (testcontainers).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    <<: *app
    build: .
    command: ["/usr/local/bin/migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["/usr/local/bin/api"]
    # Longer than SHUTDOWN_TIMEOUT (20s), so in-flight work finishes before Docker kills it.
    stop_grace_period: 30s
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # A stand-in provider, so the stack runs with no setup (D-020). Internal
  # only: no host port. Set PROVIDER_URL to use webhook.site instead.
  fakeprovider:
    image: notification-service:local
    pull_policy: never
    command: ["/usr/local/bin/fakeprovider"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["/usr/local/bin/worker"]
    # PROVIDER_URL from .env or the shell wins; unset or empty → the built-in
    # fake provider. The worker logs the provider's host at startup.
    environment:
      DATABASE_URL: postgres://notifications:notifications@postgres:5432/notifications?sslmode=disable
      PROVIDER_URL: ${PROVIDER_URL:-http://fakeprovider:9090/send}
    # Longer than SHUTDOWN_TIMEOUT (20s), so in-flight sends finish before Docker kills it.
    stop_grace_period: 30s
    # The worker's own HTTP server: GET /health (liveness) and GET /metrics.
    ports:
      - "${WORKER_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      fakeprovider:
        condition: service_started

volumes:
  pgdata:
